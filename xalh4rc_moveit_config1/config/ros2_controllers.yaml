# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xela_taxel_joint_state_publisher:
      type: xela_taxel_joint_state_publisher/XelaTaxelJointStatePublisher

hand_controller:
  ros__parameters:
    joints:
      - ah_joint00
      - ah_joint01
      - ah_joint02
      - ah_joint03
      - ah_joint10
      - ah_joint11
      - ah_joint12
      - ah_joint13
      - ah_joint20
      - ah_joint21
      - ah_joint22
      - ah_joint23
      - ah_joint30
      - ah_joint31
      - ah_joint32
      - ah_joint33
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

xela_taxel_joint_state_publisher:
  ros__parameters:
    config_yaml: package://xela_taxel_joint_state_publisher/config/xela_taxel_jsp_config.yaml
    device_profiles:
      - allegrohand
    output_topic: /joint_states_full
    # source_list (optional): list of input joint_state topics to merge; omit to use defaults.
    publish_rate: 30.0
    preserve_input_order: true